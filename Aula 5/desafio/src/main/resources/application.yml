spring:
  application.name: checkout
  datasource:
    url: ${DB_URL:jdbc:h2:mem:checkout;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    # Em producao a migracao roda como Job separado antes do deploy (FLYWAY_ENABLED=false nas replicas).
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
server:
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
info:
  app.version: ${APP_VERSION:dev}
  app.revision: ${GIT_SHA:dev}
