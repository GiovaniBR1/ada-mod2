spring:
  threads:
    virtual:
      enabled: true          # Variação A: Tomcat atende cada requisição numa thread virtual (Java 21)

parceiro:
  base-url: http://localhost:9999   # nos testes, trocado pela URL do WireMock
  connect-timeout: 1s              # tempo máximo para ABRIR a conexão
  read-timeout: 2s                 # tempo máximo esperando a RESPOSTA (corta o parceiro lento)
  retry-after-segundos: 2

resilience4j:
  retry:
    instances:
      parceiro:
        max-attempts: 3            # inclui a primeira chamada; PagamentoService.MAX_CHAMADAS
  circuitbreaker:
    instances:
      parceiro:
        # Janela curta para o teste acabar: 4 chamadas e 2 s aberto.
        # O desenho (anexo) usa 50 chamadas, 20 no mínimo, lenta a 1500 ms / 60%, aberto 30 s, 5 em half-open.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50          # 50% de falha -> OPEN
        slow-call-duration-threshold: 900ms
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 2s     # tempo em OPEN antes de testar de novo (HALF_OPEN)
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: false
  bulkhead:
    instances:
      parceiro:
        max-concurrent-calls: 200           # no máximo 200 chamadas simultâneas ao parceiro
        max-wait-duration: 50ms
