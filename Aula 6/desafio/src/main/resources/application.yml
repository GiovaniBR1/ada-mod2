spring:
  application.name: checkout
server:
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
checkout:
  # Fixture do laboratorio para o smoke subir. O teto de producao e 1,5 vez a soma medida na hora anterior.
  teto-pendente-cliente-centavos: 200000
  teto-pendente-global-centavos: 800000000
  webhook-segredo: ${WEBHOOK_SEGREDO:segredo-de-exemplo}
  versao: ${APP_VERSION:v2}
info:
  app.version: ${APP_VERSION:v2}
