spring:
  application.name: checkout
server:
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
checkout:
  # Decisao operacional (a aula nao fixa estes tetos). R$ 2.000 por cliente e R$ 8.000.000 no total.
  teto-pendente-cliente-centavos: 200000
  teto-pendente-global-centavos: 800000000
  webhook-segredo: ${WEBHOOK_SEGREDO:segredo-de-exemplo}
  versao: ${APP_VERSION:v2}
info:
  app.version: ${APP_VERSION:v2}
